<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Tszheoi Law</title>
<meta name="description" content="Tszheoi Law — you can call me Pelakai.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232d3142'/%3E%3Ctext x='50' y='68' font-size='52' font-family='system-ui,sans-serif' font-weight='800' fill='%2352d6a8' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink:   #2d3142;   /* 深藏青文字 */
    --accent:#52d6a8;   /* 薄荷绿 */
    --bg:    #ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }

  main{
    text-align:center;
    max-width:820px;
    width:100%;
  }

  h1,h2{
    font-weight:800;
    line-height:1.22;
    letter-spacing:-0.02em;
    font-size:clamp(30px, 5.4vw, 56px);
  }

  h1 .name,
  h2 .name{
    color:var(--accent);
    white-space:nowrap;   /* 名字整体换行，不拆开 */
  }

  h2{
    margin-top:.18em;
  }
</style>
</head>
<body>
<main>
  <h1>Hii, I'm <span class="name">Tszheoi Law</span>.</h1>
  <h2>U can call me <span class="name">Pelakai</span>.</h2>
</main>
</body>
</html>
