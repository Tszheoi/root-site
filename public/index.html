<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Tszheoi Law</title>
<meta name="description" content="Tszheoi Law — you can call me Pelakai.">
<style>
  :root {
    --ink:   #2d3142;   /* 深藏青文字 */
    --accent:#52d6a8;   /* 薄荷绿 */
    --bg:    #ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }

  main{
    text-align:center;
    max-width:820px;
    width:100%;
  }

  h1,h2{
    font-weight:800;
    line-height:1.22;
    letter-spacing:-0.02em;
    font-size:clamp(30px, 5.4vw, 56px);
  }

  h1 .name,
  h2 .name{
    color:var(--accent);
    white-space:nowrap;   /* 名字整体换行，不拆开 */
  }

  h2{
    margin-top:.18em;
  }
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<main>
  <h1>Hi, I'm <span class="name">Tszheoi Law</span>.</h1>
  <h2>You can call me <span class="name">Pelakai</span>.</h2>
</main>
</body>
</html>
